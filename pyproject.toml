[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "AI 知识库助手：自动采集 AI/LLM/Agent 领域技术动态"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "litellm>=1.40",
    "cryptography>=42.0",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["litellm", "cryptography.*", "langgraph.*", "fastapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
