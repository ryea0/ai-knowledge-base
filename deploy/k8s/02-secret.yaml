# 敏感配置（Secret）
# 部署前须替换占位符为真实 base64 编码值：
#   echo -n 'your-secret' | base64
# 生产环境建议改用 ExternalSecret / SealedSecret / Vault，禁止将明文密钥提交到 Git
apiVersion: v1
kind: Secret
metadata:
  name: kb-secret
  namespace: ai-knowledge-base
  labels:
    app.kubernetes.io/name: ai-knowledge-base
type: Opaque
stringData:
  MYSQL_PASSWORD: "REPLACE_ME"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME"
  LLM_API_KEY: "REPLACE_ME"
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  FEISHU_WEBHOOK_URL: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
