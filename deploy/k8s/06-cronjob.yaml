# CronJob - 定时执行采集->分析->分发全流程
# 每 6 小时执行一次，可通过 successfulJobsHistoryLimit 保留历史日志
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kb-collector
  namespace: ai-knowledge-base
  labels:
    app.kubernetes.io/name: ai-knowledge-base
    app.kubernetes.io/component: app
spec:
  schedule: "0 */6 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: kb-app
              image: kb-app:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.main"]
              args: ["--stage", "all"]
              envFrom:
                - configMapRef:
                    name: kb-config
                - secretRef:
                    name: kb-secret
              volumeMounts:
                - name: kb-data
                  mountPath: /app/knowledge
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
          volumes:
            - name: kb-data
              persistentVolumeClaim:
                claimName: kb-data-pvc
