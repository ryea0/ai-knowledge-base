# AI 知识库 RSS 数据源配置
# 每个源包含：name（名称）、url（RSS 地址）、category（分类）、enabled（是否启用采集）
# 量大的源默认 enabled: false，待确认后再开启

sources:
  # ============================================================
  # 综合技术
  # ============================================================
  - name: Hacker News Best
    url: https://hnrss.org/best
    category: general_tech
    enabled: true

  - name: Lobsters AI/ML
    url: https://lobste.rs/t/ai.rss
    category: general_tech
    enabled: true

  # ============================================================
  # AI 研究
  # ============================================================
  - name: arXiv cs.AI
    url: http://export.arxiv.org/rss/cs.AI
    category: ai_research
    enabled: false  # 日均 50+ 篇，量较大，确认采集策略后开启

  # ============================================================
  # 公司博客
  # ============================================================
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    category: company_blog
    enabled: true

  - name: Anthropic Research
    url: https://www.anthropic.com/feed.xml
    category: company_blog
    enabled: true

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    category: company_blog
    enabled: true

  # ============================================================
  # 中文社区
  # ============================================================
  - name: 机器之心
    url: https://www.jiqizhixin.com/rss
    category: chinese_community
    enabled: false  # 需确认 RSS 可用性

  - name: 量子位
    url: https://www.qbitai.com/feed
    category: chinese_community
    enabled: false  # 需确认 RSS 可用性
