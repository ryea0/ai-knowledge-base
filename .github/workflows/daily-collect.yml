name: Daily Knowledge Collect

on:
  schedule:
    # 每天 UTC 08:00（北京时间 16:00）
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_USER: kb_app
  MYSQL_PASSWORD: kb_ci_password
  MYSQL_DATABASE: ai_knowledge
  LLM_PROVIDER_ENCRYPTION_KEY: ci-encryption-passphrase
  LLM_DEFAULT_PROVIDER_CODE: ark
  CODING_PLAN_API_KEY: ${{ secrets.CODING_PLAN_API_KEY }}
  AGENT_PLAN_API_KEY: ${{ secrets.AGENT_PLAN_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kb_ci_root
          MYSQL_USER: kb_app
          MYSQL_PASSWORD: kb_ci_password
          MYSQL_DATABASE: ai_knowledge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u kb_app -pkb_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u kb_app -pkb_ci_password --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL not ready after 60s"
          exit 1

      - name: Initialize database schema
        run: |
          for sql_file in deploy/sql/*.sql; do
            echo "Executing $sql_file ..."
            mysql -h 127.0.0.1 -P 3306 -u kb_app -pkb_ci_password ai_knowledge < "$sql_file"
          done

      - name: Seed LLM providers
        run: uv run python -m scripts.seed_llm_providers

      - name: Run pipeline
        run: uv run python -m src.pipeline.pipeline --sources rss --limit 10 --verbose

      - name: Validate articles
        run: |
          shopt -s nullglob
          files=(knowledge/articles/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No articles to validate"
            exit 0
          fi
          uv run python hooks/validate_json.py "${files[@]}"

      - name: Check article quality
        run: |
          shopt -s nullglob
          files=(knowledge/articles/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No articles to check"
            exit 0
          fi
          uv run python hooks/check_quality.py "${files[@]}" || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add knowledge/raw/ knowledge/articles/

          if git diff --cached --quiet; then
            echo "No new articles to commit, skipping push"
            exit 0
          fi

          ARTICLE_COUNT=$(find knowledge/articles/ -name '*.json' -newer .git/HEAD 2>/dev/null | wc -l)
          DATE=$(date -u +%Y-%m-%d)

          git commit -m "chore(kb): daily collect - ${ARTICLE_COUNT} articles (${DATE})"

          git push
